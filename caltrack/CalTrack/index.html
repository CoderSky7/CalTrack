<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#F5F7FA"><meta name="description" content="CalTrack: your everyday meal journal. Find familiar foods and keep your meals in one place."><title>CalTrack — Meal journal</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%2333C375'/%3E%3Ctext x='14' y='46' font-size='42' fill='%231A1A2E' font-family='Arial'%3EC%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"></head><body><header><a href="#home" class="brand"><span class="mark leaf-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 4c-8-1-15 2-15 8a6 6 0 0 0 6 6c6 0 9-7 9-14Z"/><path d="M4 21 15 10"/></svg></span><span class="brand-copy"><span>CalTrack</span><span id="header-date"></span></span></a><span class="header-note">YOUR DAILY MEAL JOURNAL</span><button id="theme-top" class="icon-button" aria-label="Toggle dark mode">◐</button></header><main id="main"></main><button id="floating-add" class="floating-add" data-page="add" aria-label="Add food" title="Add food">+</button><nav aria-label="Main navigation" id="nav"></nav><dialog id="food-dialog"><form id="food-form"><div class="section-head"><span class="eyebrow" id="food-category"></span><button type="button" class="icon-button" id="close-dialog" aria-label="Close">×</button></div><h2 id="food-name"></h2><p class="muted" id="food-serving"></p><label for="meal">Add to meal</label><select id="meal"><option>Breakfast</option><option>Lunch</option><option>Dinner</option><option>Snacks</option></select><label for="serving">Serving description</label><input id="serving" maxlength="120" required><p class="muted small">Use any description that works for your meal.</p><label for="entry-note">Meal note <span class="muted">(optional)</span></label><textarea id="entry-note" maxlength="500" rows="3" placeholder="A recipe detail, a favourite flavour, or who you ate with…"></textarea><button class="primary wide" type="submit">Save to journal</button></form></dialog><dialog id="clear-dialog" aria-labelledby="clear-title" aria-describedby="clear-description"><h2 id="clear-title">Clear this day?</h2><p id="clear-description">This removes all meals recorded for the selected date.</p><div class="actions"><button id="cancel-clear">Keep meals</button><button class="danger" id="confirm-clear">Clear entries</button></div></dialog><dialog id="custom-dialog"><form id="custom-form"><div class="section-head"><span class="eyebrow">YOUR FOOD COLLECTION</span><button type="button" id="custom-close" class="icon-button" aria-label="Close custom food form">×</button></div><h2>Create Custom Food</h2><label for="custom-name">Food name</label><input id="custom-name" maxlength="80" required placeholder="e.g. Homemade vegetable pulao"><label for="custom-serving">Serving description</label><input id="custom-serving" maxlength="120" required placeholder="e.g. 1 bowl"><p class="muted small">Saved on this device for future searches.</p><button type="submit" class="primary wide">Save custom food</button></form></dialog><div id="undo-toast" hidden><span id="undo-message" role="status"></span><button id="undo-delete">Undo</button></div><div id="toast" role="status" aria-live="polite"></div><script src="app.js"></script></body></html>
